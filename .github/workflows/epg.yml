name: Update EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  epg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download public EPG
        run: |
          curl -fL https://iptv-org.github.io/epg/guides/en.xml -o epg.xml || echo "EPG source unavailable"

      - name: Save EPG
        run: |
          if [ -s epg.xml ]; then
            git config user.name github-actions
            git config user.email github-actions@github.com
            git add epg.xml
            git diff --cached --quiet || git commit -m "Update EPG"
            git push
          fi
